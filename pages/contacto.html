<main>
    <h1 class="title">Contactanos</h1>

    <section class="contacto">

        <!-- Formulario -->
        <form class="contacto-formulario" action="#">
            <fieldset>
                <legend>Datos personales</legend>

                <div class="contacto-campos">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
            </fieldset>

            <label for="comentario">Comentarios</label>

            <textarea id="comentario"
                name="comentario"
                placeholder="Escribí tu comentario"
                required></textarea>

            <button type="submit">Enviar</button>
        </form>

        <!-- Mapa -->
        <div class="contacto-mapa">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d37588.83449967895!2d-65.23490078273778!3d-26.812063804957845!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225c67ac0600d9%3A0xc03e364bcf3e1588!2sClick%20Materiales%20Tecnopor%20(Distribuidor%20KNAUF)!5e0!3m2!1ses-419!2sar!4v1791509674664!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

    </section>
</main>
